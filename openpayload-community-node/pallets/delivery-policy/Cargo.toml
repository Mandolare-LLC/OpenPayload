[package]
name = "pallet-delivery-policy"
version = "0.1.0"
edition = "2021"

[dependencies]
frame-benchmarking = { workspace = true, optional = true }
dnssec-prover = { path = "../../vendor/dnssec-prover", default-features = false, features = ["validation"] }
sp-io = { workspace = true }
codec = { workspace = true, features = ["derive"] }
frame-support = { workspace = true }
frame-system = { workspace = true }
pallet-timestamp = { workspace = true }
scale-info = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, default-features = false, features = ["alloc"] }
sp-api = { workspace = true }
sp-runtime = { workspace = true }

[dev-dependencies]
sp-core = { workspace = true, features = ["std"] }
p256 = { version = "0.13.2", features = ["ecdsa"] }
sp-io = { workspace = true, features = ["std"] }

[features]
default = ["std"]
std = [
	"frame-benchmarking?/std",
	"codec/std",
	"sp-io/std",
	"dnssec-prover/std",
	"frame-support/std",
	"frame-system/std",
	"pallet-timestamp/std",
	"scale-info/std",
	"serde_json/std",
	"sp-api/std",
	"sp-runtime/std",
]

try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"sp-runtime/try-runtime",
]

runtime-benchmarks = ["frame-benchmarking/runtime-benchmarks", "frame-support/runtime-benchmarks", "frame-system/runtime-benchmarks", "pallet-timestamp/runtime-benchmarks"]
