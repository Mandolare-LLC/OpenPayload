[package]
name = "pallet-application-registry"
version = "0.1.0"
edition = "2021"
license.workspace = true
authors.workspace = true
homepage.workspace = true
publish = false

[dependencies]
frame-benchmarking = { workspace = true, optional = true }
codec = { workspace = true, features = ["derive"] }
frame-support = { workspace = true }
frame-system = { workspace = true }
pallet-delivery-policy = { workspace = true }
pallet-timestamp = { workspace = true }
scale-info = { workspace = true, features = ["derive"] }
sp-runtime = { workspace = true, default-features = false }

[dev-dependencies]
sp-core = { workspace = true, features = ["std"] }
sp-io = { workspace = true, features = ["std"] }

[features]
default = ["std"]
std = [
    "codec/std",
    "frame-support/std",
    "frame-benchmarking?/std",
    "frame-system/std",
    "pallet-delivery-policy/std",
    "pallet-timestamp/std",
    "scale-info/std",
    "sp-runtime/std",
]
try-runtime = [
    "frame-support/try-runtime",
    "frame-system/try-runtime",
    "pallet-delivery-policy/try-runtime",
    "sp-runtime/try-runtime",
]

runtime-benchmarks = ["frame-benchmarking/runtime-benchmarks", "frame-system/runtime-benchmarks", "frame-support/runtime-benchmarks", "pallet-timestamp/runtime-benchmarks"]
