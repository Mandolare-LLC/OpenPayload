[workspace.package]
license = "Unlicense"
authors = ["Mandolare LLC"]
homepage = "https://openpayload.io"
edition = "2021"

[workspace]
members = [
    "node",
    "pallets/application-registry",
    "pallets/authority-governance",
    "pallets/did-registry",
    "pallets/delivery-policy",
    "pallets/opal",
    "pallets/resource-rewards",
    "runtime",
]
resolver = "2"

[workspace.dependencies]
openpayload-runtime = { path = "./runtime", default-features = false }
pallet-application-registry = { path = "./pallets/application-registry", default-features = false }
pallet-authority-governance = { path = "./pallets/authority-governance", default-features = false }
pallet-did-registry = { path = "./pallets/did-registry", default-features = false }
pallet-delivery-policy = { path = "./pallets/delivery-policy", default-features = false }
pallet-opal = { path = "./pallets/opal", default-features = false }
pallet-resource-rewards = { path = "./pallets/resource-rewards", default-features = false }
clap = { version = "4.6.1" }
frame-benchmarking-cli = { version = "58.0.0", default-features = false }
frame-metadata-hash-extension = { version = "0.16.0", default-features = false }
frame-system = { version = "48.0.0", default-features = false }
futures = { version = "0.3.32" }
jsonrpsee = { version = "0.24.11" }
pallet-transaction-payment = { version = "49.0.0", default-features = false }
pallet-transaction-payment-rpc = { version = "52.0.0", default-features = false }
sc-basic-authorship = { version = "0.56.0", default-features = false }
sc-cli = { version = "0.61.0", default-features = false }
sc-client-api = { version = "47.0.0", default-features = false }
sc-consensus = { version = "0.57.0", default-features = false }
sc-consensus-aura = { version = "0.58.0", default-features = false }
sc-consensus-grandpa = { version = "0.43.0", default-features = false }
sc-executor = { version = "0.50.0", default-features = false }
sc-network = { version = "0.58.0", default-features = false }
sc-offchain = { version = "53.0.0", default-features = false }
sc-service = { version = "0.60.0", default-features = false }
sc-telemetry = { version = "33.0.0", default-features = false }
sc-transaction-pool = { version = "47.0.0", default-features = false }
sc-transaction-pool-api = { version = "46.0.0", default-features = false }
sp-api = { version = "43.0.0", default-features = false }
sp-block-builder = { version = "43.0.0", default-features = false }
sp-blockchain = { version = "46.0.0", default-features = false }
sp-consensus-aura = { version = "0.49.0", default-features = false }
sp-core = { version = "43.0.0", default-features = false }
sp-genesis-builder = { version = "0.24.0", default-features = false }
sp-inherents = { version = "43.0.0", default-features = false }
sp-io = { version = "48.0.0", default-features = false }
sp-keyring = { version = "48.0.0", default-features = false }
sp-runtime = { version = "48.0.0", default-features = false }
sp-timestamp = { version = "43.0.0", default-features = false }
substrate-frame-rpc-system = { version = "53.0.0", default-features = false }
substrate-build-script-utils = { version = "11.0.3", default-features = false }
codec = { version = "3.7.5", default-features = false, package = "parity-scale-codec" }
frame-benchmarking = { version = "49.0.0", default-features = false }
frame-executive = { version = "48.0.0", default-features = false }
frame-support = { version = "48.0.0", default-features = false }
frame-system-benchmarking = { version = "49.0.0", default-features = false }
frame-system-rpc-runtime-api = { version = "43.0.0", default-features = false }
frame-try-runtime = { version = "0.54.0", default-features = false }
pallet-aura = { version = "48.0.0", default-features = false }
pallet-balances = { version = "50.0.0", default-features = false }
pallet-grandpa = { version = "49.0.0", default-features = false }
pallet-sudo = { version = "49.0.0", default-features = false }
pallet-timestamp = { version = "48.0.0", default-features = false }
pallet-transaction-payment-rpc-runtime-api = { version = "49.0.0", default-features = false }
scale-info = { version = "2.11.6", default-features = false }
serde_json = { version = "1.0.150", default-features = false }
sp-consensus-grandpa = { version = "30.0.0", default-features = false }
sp-offchain = { version = "43.0.0", default-features = false }
sp-session = { version = "45.0.0", default-features = false }
sp-storage = { version = "25.0.0", default-features = false }
sp-transaction-pool = { version = "43.0.0", default-features = false }
sp-version = { version = "46.0.0", default-features = false }
substrate-wasm-builder = { version = "34.0.0", default-features = false }

[profile.release]
opt-level = 3
panic = "unwind"

[profile.production]
codegen-units = 1
inherits = "release"
lto = true
