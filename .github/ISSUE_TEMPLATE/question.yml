name: Question
description: Ask a public support or usage question.
title: "[QUESTION] "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reaching out.

        **All submissions are public. Do not include confidential information, credentials, source code from private repositories, proprietary technical details, customer information, or security-sensitive material.**

        For general conversations, use GitHub Discussions if they are enabled for this repository.

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What would you like to know?
      placeholder: Ask a clear, focused question.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Share public, non-sensitive context that helps maintainers understand the question.
      placeholder: Describe what you are trying to accomplish.
    validations:
      required: false

  - type: textarea
    id: already-tried
    attributes:
      label: What has already been tried
      description: Describe documentation, examples, or public troubleshooting steps you have already reviewed.
      placeholder: List public links, commands, or steps that are safe to share.
    validations:
      required: false

  - type: checkboxes
    id: public-disclosure
    attributes:
      label: Public Disclosure Confirmation
      description: Confirm that this question is safe for public disclosure.
      options:
        - label: I have removed confidential information, credentials, private source code, proprietary technical details, customer information, and security-sensitive material.
          required: true
